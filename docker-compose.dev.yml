# Dev only. Phase 0 runs the orchestrator alone; sandbox and gateway services arrive in Phase 2.
# TODO: pin the image by digest. Use on a Linux host (node_modules is built for the container).
services:
  orchestrator:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
      - data:/app/data
    environment:
      DB_PATH: /app/data/devagent.db
      NODE_ENV: development
      SOLANA_CLUSTER: devnet
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev"
volumes:
  data:
