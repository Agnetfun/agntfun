<div
  class="modal"
  id="wallet-modal"
  hidden
  role="dialog"
  aria-modal="true"
  aria-labelledby="wm-title"
>
  <div class="modal-card">
    <div class="row">
      <h2 id="wm-title">Connect wallet</h2>
      <button class="btn small ghost" type="button" id="wm-close" aria-label="Close">
        {{icon:x}}
      </button>
    </div>
    <p class="muted" id="wm-sub">
      Connect a Solana wallet. Connecting never spends money. Signing a message proves it is you.
    </p>
    <div class="wallet-list" id="wm-list">
      <button class="wallet-opt" type="button" data-w="privy" id="wm-privy" hidden>
        <span class="wmark wm-v">@</span><span>Email, Google or any wallet</span>
      </button>
      <button class="wallet-opt" type="button" data-w="phantom">
        <span class="wmark wm-p">P</span><span>Phantom</span>
      </button>
      <button class="wallet-opt" type="button" data-w="solflare">
        <span class="wmark wm-s">S</span><span>Solflare</span>
      </button>
    </div>
    <div class="wallet-on" id="wm-on" hidden>
      <p class="muted">Connected</p>
      <p class="mono" id="wm-addr"></p>
      <button class="btn" type="button" id="wm-disc">Disconnect</button>
    </div>
    <p class="err" id="wm-err" role="alert"></p>
    <p class="note muted">
      No wallet yet?
      <a href="https://phantom.com/download" rel="noopener noreferrer" target="_blank"
        >Get Phantom</a
      >.
    </p>
  </div>
</div>
<script src="/wallet.js" defer></script>
<script src="/site.js" defer></script>
<script src="/shell.js" defer></script>
